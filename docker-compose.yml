services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Diisi dari file .env di folder ini (lihat .env.example).
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: pedal-padel-web
    ports:
      - "8080:80"
    restart: unless-stopped
